[package]
name = "codex-usage-widget"
version = "0.1.2"
license = "MIT"
edition = "2021"
publish = false

[patch.crates-io]
auto-launch = { path = "vendor/auto-launch" }

[lib]
name = "codex_usage_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-notification = "=2.7.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-bindings = { package = "windows", version = "=0.62.2", features = ["UI_Notifications", "Win32_System_WinRT", "Win32_System_Com", "Win32_UI_Shell", "Win32_Foundation"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_Time", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
